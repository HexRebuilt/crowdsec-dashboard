name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: '20'
      - uses: actions/checkout@v6.0.3
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.12'
      - run: pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit Python dependencies
        run: pip-audit --strict
      - run: pytest itest/ -v --tb=short

  vulnerability-scan:
    permissions:
      security-events: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: '20'
      - uses: actions/checkout@v6.0.3
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-fs'

  build:
    needs: [test, vulnerability-scan]
    permissions:
      packages: write
      security-events: write
      contents: read
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    env:
      REGISTRY_OWNER: ${{ github.repository_owner }}
    steps:
      - id: lowercase_owner
        run: echo "owner_lower=${REGISTRY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: '20'
      - uses: actions/checkout@v6.0.3
      - uses: docker/setup-buildx-action@v4.1.0
      - uses: docker/login-action@v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7.2.0
        with:
          context: .
          push: true
          tags: ghcr.io/${{ steps.lowercase_owner.outputs.owner_lower }}/crowdsec-dashboard:latest
          cache-from: type=registry,ref=ghcr.io/${{ steps.lowercase_owner.outputs.owner_lower }}/crowdsec-dashboard:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ steps.lowercase_owner.outputs.owner_lower }}/crowdsec-dashboard:buildcache,mode=max
      - name: Scan built image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'image'
          image-ref: ghcr.io/${{ steps.lowercase_owner.outputs.owner_lower }}/crowdsec-dashboard:latest
          format: 'sarif'
          output: 'trivy-image-results.sarif'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
      - name: Upload image scan results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-image-results.sarif'
          category: 'trivy-image'
