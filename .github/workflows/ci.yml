name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.1.1
      - uses: actions/setup-python@v5.1.0
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit Python dependencies
        run: pip-audit --strict
      - run: pytest itest/ -v --tb=short

  vulnerability-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.1.1
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.50.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3.27.4
        with:
          sarif_file: 'trivy-results.sarif'

  build:
    needs: [test, vulnerability-scan]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4.1.1
      - uses: docker/setup-buildx-action@v3.7.1
      - uses: docker/login-action@v3.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5.4.0
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/crowdsec-dashboard:latest
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/crowdsec-dashboard:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/crowdsec-dashboard:buildcache,mode=max
      - name: Scan built image for vulnerabilities
        uses: aquasecurity/trivy-action@0.50.0
        with:
          scan-type: 'image'
          image-ref: ghcr.io/${{ github.repository_owner }}/crowdsec-dashboard:latest
          format: 'sarif'
          output: 'trivy-image-results.sarif'
          severity: 'HIGH,CRITICAL'
      - name: Upload image scan results
        uses: github/codeql-action/upload-sarif@v3.27.4
        with:
          sarif_file: 'trivy-image-results.sarif'
