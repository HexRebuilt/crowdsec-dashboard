services:
  redis:
    image: redis:7-alpine
    container_name: crowdsec-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - traefik_cloudflared_default

  crowdsec-dashboard:
    image: ghcr.io/hexrebuilt/crowdsec-dashboard:latest
    container_name: crowdsec-dashboard
    restart: unless-stopped
    networks:
      - traefik_cloudflared_default
    env_file:
      - .env
    environment:
      CROWDSEC_URL: http://crowdsec:8080
      POLL_INTERVAL: "30"
      NOTIFY_ON_BAN: "true"
      NOTIFY_ON_ALERT: "true"
      ALERT_THRESHOLD: "5"
      BAN_THRESHOLD: "0"
      NOTIFY_COOLDOWN: "3600"
      DIGEST_INTERVAL: "0"
      # ⚠️ WARNING: UNSECURE=true disables authentication on ALL endpoints.
      # Only use for local development. Never enable in production.
      UNSECURE: "true"
      LOG_LEVEL: "INFO"
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  redis_data:

networks:
  traefik_cloudflared_default:
    external: true
