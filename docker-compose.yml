services:
  crowdsec-dashboard:
    build:
      context: .
    container_name: crowdsec-dashboard
    restart: unless-stopped
    networks:
      - traefik_cloudflared_default
    env_file:
      - .env
    environment:
      CROWDSEC_URL: http://crowdsec:8080
      POLL_INTERVAL: "30"
      NOTIFY_ON_BAN: "true"
      NOTIFY_ON_ALERT: "true"
      ALERT_THRESHOLD: "5"
      BAN_THRESHOLD: "0"
      NOTIFY_COOLDOWN: "3600"
      DIGEST_INTERVAL: "0"
      UNSECURE: "true"
      LOG_LEVEL: "INFO"
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  traefik_cloudflared_default:
    external: true
